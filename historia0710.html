<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uporządkuj swoją wiedzę – II Rzeczpospolita</title>
<style>
:root{
  --page:#e6ebf2; --sheet:#f4f6fa; --line:#6f7a8b; --ink:#1d3fa6; --gap:22px;
  --hand:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);font-family:var(--ui);color:#1c2230;-webkit-text-size-adjust:100%}

/* ---------- pasek sterowania ---------- */
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #c6cedb;box-shadow:0 2px 8px rgba(20,30,60,.08)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid #b5bfd0;background:#f1f4f9;color:#2a3550;border-radius:999px;padding:6px 12px;font:600 12.5px var(--ui);cursor:pointer;white-space:nowrap}
.tab:hover{background:#e4eaf4}
.tab.on{background:#2c4f9e;border-color:#2c4f9e;color:#fff}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:4px 10px 9px;font-size:12.5px}
.grp-b{display:flex;align-items:center;gap:5px}
.grp-b .lbl{color:#4b566d;font-weight:600}
.btn{border:1px solid #2c4f9e;background:#fff;color:#2c4f9e;border-radius:6px;padding:5px 10px;font:600 12.5px var(--ui);cursor:pointer}
.btn:hover{background:#eaf0fb}
.btn.fill{background:#2c4f9e;color:#fff}
.btn.fill:hover{background:#244486}
.count{margin-left:auto;color:#4b566d;font-variant-numeric:tabular-nums}
.hint{width:100%;color:#6b7589;font-size:11.5px}

/* ---------- karta pracy ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:14px 10px 40px}
.sheet{display:none;position:relative;background:var(--sheet);border:1px solid #c3cbd9;border-radius:10px;padding:22px 22px 26px;box-shadow:0 4px 16px rgba(30,45,80,.10)}
.sheet.on{display:block}
.meta{text-align:right;font-size:11px;letter-spacing:.04em;color:#5d7396;margin:-8px 0 8px}
.pg{text-align:right;margin-top:16px;font:700 13px var(--ui);color:#fff}
.pg span{display:inline-block;background:#2c4f9e;padding:3px 10px;border-radius:3px}
.stitle{font:800 25px var(--ui);color:#2c4f9e;padding-bottom:6px;border-bottom:1.5px solid #2c4f9e;margin:0 0 22px}
.toprow{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap);margin-bottom:26px}

/* ---------- drzewo ---------- */
.tree{margin-bottom:6px}
.tree + .tree{margin-top:34px}
.root{position:relative;max-width:470px;margin:0 auto;text-align:center;font-weight:700;font-size:15px;padding:11px 16px;
  background:linear-gradient(#d3dae6,#b6c1d3);border:1px solid #8794ab;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.root::after{content:"";position:absolute;left:50%;top:100%;height:15px;border-left:1.5px solid var(--line)}
.cols{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap);margin-top:15px;padding-top:15px;align-items:start}
.cols::before{content:"";position:absolute;top:0;
  left:calc((100% - (var(--n) - 1) * var(--gap)) / var(--n) / 2);
  right:calc((100% - (var(--n) - 1) * var(--gap)) / var(--n) / 2);
  border-top:1.5px solid var(--line)}
.col{position:relative;min-width:0}
.col::before{content:"";position:absolute;left:50%;top:-15px;height:15px;border-left:1.5px solid var(--line)}
.grp + .grp{margin-top:18px}
.colhead{text-align:center;font-weight:700;font-size:13.5px;padding:10px 12px;background:linear-gradient(#e0e5ee,#c7d0de);border:1px solid #8f9bb0;border-radius:3px}
.stack{margin-left:16px;border-left:1.5px solid var(--line);padding:13px 0 0 14px;display:flex;flex-direction:column;gap:13px}

/* ---------- karteczka z pytaniem ---------- */
.card{position:relative;background:#fff;border:1px solid #8f98a6;border-radius:3px;padding:12px 14px 9px;text-align:center;font-size:13px;line-height:1.35;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.stack > .card::before{content:"";position:absolute;left:-14px;top:20px;width:14px;border-top:1.5px solid var(--line)}
.stack > .card:last-child::after{content:"";position:absolute;left:-17px;top:22px;bottom:-1px;width:5px;background:var(--sheet)}
.ct{font-weight:700;font-size:13.5px;margin-bottom:6px}
.q{margin:6px 0 1px}
.q:first-of-type,.ct + .q{margin-top:0}
.arow{display:flex;align-items:flex-end;gap:8px;margin:2px 0 4px;text-align:left}
.arow .ans:first-child{flex:1;min-width:0}

/* ---------- odpowiedzi ---------- */
.ans{display:block;position:relative;cursor:pointer;font-family:var(--hand);font-size:15px;line-height:24px;min-height:24px;color:var(--ink);
  padding:0 5px;text-align:left;border-radius:2px;
  background-image:linear-gradient(to bottom,transparent 23px,#8d95a3 23px,#8d95a3 24px);background-size:100% 24px;
  transition:background-color .15s,color .15s;-webkit-tap-highlight-color:transparent}
.ans:focus-visible{outline:2px solid #2c4f9e;outline-offset:1px}
.ans.hid{color:transparent;background-color:rgba(29,63,166,.07);user-select:none;-webkit-user-select:none}
.ans.hid:hover{background-color:rgba(29,63,166,.17)}
.ans.note{display:inline-block;flex:0 0 auto;background-image:none;white-space:nowrap;padding:0 6px}
.lst{margin:3px 0 2px;text-align:left}
.bli{display:flex;align-items:flex-start;gap:5px}
.bli::before{content:"•";line-height:24px;font-size:14px;color:#222}
.bli .ans{flex:1;min-width:0}
.bgroup{display:flex;align-items:stretch;gap:4px}
.bgroup .items{flex:1;min-width:0}
.ans.brace{display:flex;align-items:center;gap:6px;padding:0 6px 0 2px;font-size:20px;line-height:1}
.ans.brace .curly{display:block;align-self:stretch;width:9px;margin:2px 0;border:2px solid currentColor;border-left:0;border-radius:0 12px 12px 0}
.ans.brace b{font-weight:400}

/* ---------- oko ---------- */
.eye{position:absolute;top:2px;right:2px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:transparent;color:#9aa3b3;cursor:pointer;border-radius:4px;opacity:.75}
.eye:hover{color:var(--ink);background:#eaf0fb;opacity:1}

/* ---------- wąskie ekrany ---------- */
@media (max-width:860px){
  .sheet{padding:16px 12px 20px}
  .toprow{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr;padding-top:0;margin-top:14px;row-gap:22px}
  .cols::before,.col::before,.root::after{display:none}
  .stitle{font-size:21px}
  .count{margin-left:0}
}
@media print{
  .bar,.eye{display:none}
  .sheet{display:block!important;break-after:page;box-shadow:none}
}
</style>
</head>
<body>

<div class="bar">
  <div class="tabs" id="tabs"></div>
  <div class="ctrl">
    <div class="grp-b"><span class="lbl">Ta karta:</span>
      <button class="btn" id="showPage">Pokaż</button>
      <button class="btn" id="hidePage">Ukryj</button></div>
    <div class="grp-b"><span class="lbl">Wszystkie karty:</span>
      <button class="btn fill" id="showAll">Pokaż</button>
      <button class="btn fill" id="hideAll">Ukryj</button></div>
    <div class="count" id="count"></div>
    <div class="hint">Kliknij linię z odpowiedzią, aby ją odkryć lub zakryć. Ikona oka w rogu karteczki przełącza wszystkie odpowiedzi w tej karteczce.</div>
  </div>
</div>

<div class="wrap" id="wrap"></div>

/* ===== budowanie DOM ===== */
const el=(t,cls,txt)=>{const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const EYE='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';

function setHidden(n,hide){
  n.classList.toggle('hid',hide);
  n.setAttribute('aria-pressed',String(!hide));
  if(hide) n.setAttribute('aria-label','Odpowiedź zakryta – naciśnij, aby odkryć');
  else n.removeAttribute('aria-label');
}
function ans(text,cls){
  const s=el('span','ans'+(cls?' '+cls:''),text);
  s.setAttribute('role','button'); s.tabIndex=0;
  setHidden(s,true);
  return s;
}
function card(cd){
  const d=el('div','card');
  const b=el('button','eye'); b.type='button'; b.title='Pokaż / ukryj odpowiedzi w tej karteczce'; b.setAttribute('aria-label','Pokaż lub ukryj odpowiedzi w tej karteczce'); b.innerHTML=EYE;
  d.appendChild(b);
  if(cd.t) d.appendChild(el('div','ct',cd.t));
  cd.i.forEach(it=>{
    if(it.q) d.appendChild(el('p','q',it.q));
    if(it.a!=null){
      const r=el('div','arow'); r.appendChild(ans(it.a));
      if(it.n) r.appendChild(ans(it.n,'note'));
      d.appendChild(r);
    }
    if(it.l){
      const ul=el('div','lst'); const L=it.l; let i=0;
      while(i<L.length){
        if(it.br && i===it.br[0]){
          const grp=el('div','bgroup'), items=el('div','items');
          for(let j=it.br[0];j<=it.br[1];j++){
            const r=el('div','bli'); r.appendChild(ans(L[j])); items.appendChild(r);
          }
          grp.appendChild(items);
          const br=ans('','note brace'); br.innerHTML='<i class="curly"></i><b>'+it.br[2]+'</b>';
          grp.appendChild(br); ul.appendChild(grp);
          i=it.br[1]+1;
        }else{
          const r=el('div','bli'); r.appendChild(ans(L[i])); ul.appendChild(r); i++;
        }
      }
      d.appendChild(ul);
    }
  });
  return d;
}
function group(gr){
  const w=el('div','grp');
  w.appendChild(el('div','colhead',gr.head));
  const st=el('div','stack');
  gr.cards.forEach(cd=>st.appendChild(card(cd)));
  w.appendChild(st);
  return w;
}
function tree(rootText,colNodes){
  const t=el('div','tree');
  t.appendChild(el('div','root',rootText));
  const cs=el('div','cols'); cs.style.setProperty('--n',colNodes.length);
  colNodes.forEach(n=>{const col=el('div','col'); col.appendChild(n); cs.appendChild(col);});
  t.appendChild(cs);
  return t;
}
function buildSheet(s,idx){
  const sh=el('section','sheet'); sh.id='sheet'+idx;
  if(s.meta) sh.appendChild(el('div','meta',s.meta));
  if(s.title) sh.appendChild(el('h2','stitle',s.title));
  if(s.top){
    const tr=el('div','toprow'); tr.style.setProperty('--n',s.top.length);
    s.top.forEach(cd=>tr.appendChild(card(cd)));
    sh.appendChild(tr);
  }
  sh.appendChild(tree(s.root,s.cols.map(groups=>{
    const f=document.createDocumentFragment();
    groups.forEach(gr=>f.appendChild(group(gr)));
    const holder=el('div'); holder.appendChild(f); return holder;
  })));
  if(s.sub) sh.appendChild(tree(s.sub.root,s.sub.cards.map(cd=>card(cd))));
  if(s.pg){const pg=el('div','pg'); pg.appendChild(el('span',null,s.pg)); sh.appendChild(pg);}
  return sh;
}

const tabsEl=document.getElementById('tabs'), wrap=document.getElementById('wrap');
SHEETS.forEach((s,i)=>{
  const tb=el('button','tab',(i+1)+'. '+s.tab); tb.type='button'; tb.dataset.i=i;
  tabsEl.appendChild(tb);
  wrap.appendChild(buildSheet(s,i));
});

/* ===== logika ===== */
function activeSheet(){return document.querySelector('.sheet.on');}
function updateCount(){
  const sh=activeSheet(); if(!sh) return;
  const all=sh.querySelectorAll('.ans').length, open=sh.querySelectorAll('.ans:not(.hid)').length;
  document.getElementById('count').textContent='Odkryto na tej karcie: '+open+' / '+all;
}
function show(i){
  document.querySelectorAll('.sheet').forEach((s,k)=>s.classList.toggle('on',k===i));
  document.querySelectorAll('.tab').forEach((t,k)=>{t.classList.toggle('on',k===i); if(k===i) t.scrollIntoView({inline:'center',block:'nearest'});});
  updateCount();
  window.scrollTo({top:0});
}
function setAll(root,hide){root.querySelectorAll('.ans').forEach(a=>setHidden(a,hide));updateCount();}

tabsEl.addEventListener('click',e=>{const t=e.target.closest('.tab'); if(t) show(+t.dataset.i);});
document.getElementById('showPage').onclick=()=>setAll(activeSheet(),false);
document.getElementById('hidePage').onclick=()=>setAll(activeSheet(),true);
document.getElementById('showAll').onclick=()=>setAll(document,false);
document.getElementById('hideAll').onclick=()=>setAll(document,true);

wrap.addEventListener('click',e=>{
  const eye=e.target.closest('.eye');
  if(eye){
    const cd=eye.closest('.card'), anyHidden=cd.querySelector('.ans.hid');
    cd.querySelectorAll('.ans').forEach(a=>setHidden(a,!anyHidden));
    updateCount(); return;
  }
  const a=e.target.closest('.ans');
  if(a){setHidden(a,!a.classList.contains('hid'));updateCount();}
});
wrap.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('ans')){
    e.preventDefault(); setHidden(e.target,!e.target.classList.contains('hid')); updateCount();
  }
});

show(0);
</script>
